{% extends "base.html" %}
{% block title %}{{ current_chat.title }} - Tim FAQ{% endblock %}

{% block content %}
<div class="chat-page">

    <div class="chat-header">
        <span class="chat-title" id="chat-title">{{ current_chat.title }}</span>
        <div class="chat-header-actions">
            <select id="lang-select" class="lang-select" onchange="onLangChange()">
                <option value="">🌐 Language</option>
                <option value="Tamil">Tamil</option>
                <option value="Hindi">Hindi</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="Arabic">Arabic</option>
                <option value="German">German</option>
                <option value="Japanese">Japanese</option>
                <option value="Chinese">Chinese</option>
            </select>
        </div>
    </div>

    <div class="chat-thread" id="chat-thread">
        <div class="thread-inner" id="thread-inner"></div>
    </div>

    <div class="chat-input-bar">
        <div class="input-bar-inner">
            <div id="file-list" class="file-list hidden"></div>
            <div class="input-row">
                <div class="upload-btn-wrap" title="Attach document">
                    <input type="file" id="file-input" accept=".pdf,.docx,.txt,.md" multiple hidden>
                    <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Attach file">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                </div>
                <button class="icon-btn mic-btn" id="mic-btn" onclick="toggleMic()" title="Voice input">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                <textarea
                    id="prompt-input"
                    placeholder="Ask anything or attach a document..."
                    rows="1"
                    onkeydown="handleKey(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="send-btn" onclick="generate()" title="Generate FAQ from current file">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
            <!-- Two new buttons — only show when files are attached -->
            <div class="faq-btn-row hidden" id="faq-btn-row">
                <button class="faq-action-btn" id="gen-btn" onclick="generate()">
                    📄 Generate FAQ <span class="faq-btn-hint">current file</span>
                </button>
                <button class="faq-action-btn faq-action-btn-all" id="gen-all-btn" onclick="generateAll()">
                    📚 Overall FAQ <span class="faq-btn-hint">all files</span>
                </button>
            </div>
        </div>
    </div>

</div>

<script>
    const CHAT_ID = {{ current_chat.id }};
    const MAX_FILES = 5;
    const MAX_SIZE_MB = 10;
    let selectedFiles = [];
    let currentLang = "";
    let lastResponseData = null;
    let speechSynth = window.speechSynthesis;
    let currentUtterance = null;
    let isReading = false;
    let recognition = null;
    let isRecording = false;

    // --- LOAD HISTORY ---
    async function loadHistory() {
        const res  = await fetch("/chat/" + CHAT_ID + "/history");
        const data = await res.json();
        const thread = document.getElementById("thread-inner");

        if (data.history.length === 0) {
            thread.innerHTML = '<div class="empty-state"><p>Ask anything or upload a document to generate FAQs</p></div>';
            return;
        }

        thread.innerHTML = "";
        data.history.forEach(function(msg) {
            if (msg.role === "user") {
                thread.innerHTML += buildUserMessage(msg.content);
            } else {
                thread.innerHTML += buildAssistantMessage(msg);
                if (msg.collection && msg.collection.faq_pairs) {
                    lastResponseData = {
                        direct_answer: msg.content,
                        faq_pairs:     msg.collection.faq_pairs,
                        collection_id: msg.collection.id,
                        source:        msg.source
                    };
                }
            }
        });
        scrollToBottom();
    }

    // --- MESSAGE BUILDERS ---
    function buildUserMessage(content) {
        return '<div class="msg msg-user"><div class="msg-bubble">' + escapeHtml(content) + '</div></div>';
    }

    function buildAssistantMessage(msg) {
        const collectionId = msg.collection_id || "";
        let html = '<div class="msg msg-assistant">';
        html += '<div class="msg-avatar">T</div>';
        html += '<div class="msg-body">';

        if (msg.source) {
            const badgeClass = msg.source === "knowledge_base" ? "badge-document" : "badge-ai";
            const badgeText  = msg.source === "knowledge_base" ? "📚 Knowledge Base" : "🤖 Gemini AI";
            html += '<span class="source-badge ' + badgeClass + '">' + badgeText + '</span>';
        }

        if (msg.content) {
            html += '<div class="msg-answer">' + escapeHtml(msg.content) + '</div>';
        }

        if (msg.collection && msg.collection.faq_pairs && msg.collection.faq_pairs.length > 0) {
            html += '<div class="faq-section-title">Related FAQs</div>';
            html += '<div class="faq-cards">';
            msg.collection.faq_pairs.forEach(function(pair, i) {
                html += buildFAQCard(pair, i);
            });
            html += '</div>';

            html += '<div class="response-actions">';
            html += '<button class="action-btn" onclick="copyToClipboard(this)" title="Copy all">📋 Copy</button>';
            html += '<button class="action-btn" onclick="exportPDF(this)" title="Export PDF">📄 PDF</button>';
            html += '<button class="action-btn" onclick="readAloud(this)" title="Read aloud">🔊 Read</button>';
            if (collectionId) {
                html += '<button class="action-btn" onclick="shareCollection(' + collectionId + ')" title="Share">🔗 Share</button>';
            }
            html += '</div>';
        }

        html += '</div></div>';
        return html;
    }

    function buildFAQCard(pair, index) {
        const upActive   = pair.rating === "up"   ? "active-up"   : "";
        const downActive = pair.rating === "down"  ? "active-down" : "";
        const pairId     = pair.id || "";

        return '<div class="faq-card" id="faq-card-' + pairId + '">' +
            '<div class="faq-q" id="faq-q-' + pairId + '">' +
                '<span class="faq-num">Q' + (index+1) + '</span>' +
                '<span class="faq-q-text">' + escapeHtml(pair.question) + '</span>' +
                (pairId ? '<button class="edit-btn" onclick="startEdit(' + pairId + ')" title="Edit">✏️</button>' : '') +
            '</div>' +
            '<div class="faq-a" id="faq-a-' + pairId + '">' + escapeHtml(pair.answer) + '</div>' +
            (pairId ? '<div class="faq-actions">' +
                '<button class="rate-btn ' + upActive + '" onclick="rateFAQ(' + pairId + ', \'up\', this)">👍</button>' +
                '<button class="rate-btn ' + downActive + '" onclick="rateFAQ(' + pairId + ', \'down\', this)">👎</button>' +
            '</div>' : '') +
        '</div>';
    }

    // --- FILE UPLOAD ---
    document.getElementById("file-input").addEventListener("change", function(e) {
        Array.from(e.target.files).forEach(function(file) {
            if (selectedFiles.length >= MAX_FILES) { alert("Max " + MAX_FILES + " files."); return; }
            if (file.size / (1024*1024) > MAX_SIZE_MB) { alert(file.name + " exceeds 10MB."); return; }
            if (!selectedFiles.some(function(f) { return f.name === file.name && f.size === file.size; })) {
                selectedFiles.push(file);
            }
        });
        renderFileList();
        e.target.value = "";
    });

    function renderFileList() {
        const container = document.getElementById("file-list");
        const btnRow    = document.getElementById("faq-btn-row");
        if (selectedFiles.length === 0) {
            container.classList.add("hidden");
            container.innerHTML = "";
            btnRow.classList.add("hidden");
            return;
        }
        container.classList.remove("hidden");
        container.innerHTML = selectedFiles.map(function(f, i) {
            return '<div class="file-tag">📄 ' + f.name +
                '<button class="file-remove" onclick="removeFile(' + i + ')">✕</button></div>';
        }).join("");
        if (selectedFiles.length > 0) {
            btnRow.classList.remove("hidden");
        }
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderFileList();
    }

    // --- GENERATE ---
    // --- GENERATE ---
async function generate() {
    const prompt = document.getElementById("prompt-input").value.trim();
    if (!prompt && selectedFiles.length === 0) return;

    const thread = document.getElementById("thread-inner");
    const emptyState = thread.querySelector(".empty-state");
    if (emptyState) emptyState.remove();

    const label = prompt || "Generate FAQ from file";
    thread.innerHTML += buildUserMessage(label);

    const typingId = "typing-" + Date.now();
    thread.innerHTML += '<div class="msg msg-assistant" id="' + typingId + '"><div class="msg-avatar">T</div><div class="msg-body"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div>';
    scrollToBottom();

    document.getElementById("chat-title").textContent = label.slice(0, 60);

    const promptInput = document.getElementById("prompt-input");
    promptInput.value = "";
    promptInput.style.height = "auto";
    document.getElementById("send-btn").disabled = true;
    document.getElementById("gen-btn").disabled  = true;

    const formData = new FormData();
    formData.append("prompt", prompt);
    selectedFiles.forEach(function(f) { formData.append("files", f); });
    selectedFiles = [];
    renderFileList();

    try {
        const res  = await fetch("/chat/" + CHAT_ID + "/generate", { method: "POST", body: formData });
        const data = await res.json();

        document.getElementById(typingId).remove();

        if (data.error) {
            thread.innerHTML += '<div class="msg msg-assistant"><div class="msg-avatar">T</div><div class="msg-body"><div class="msg-error">' + data.error + '</div></div></div>';
        } else {
            lastResponseData = data;
            thread.innerHTML += buildAssistantMessage({
                role:          "assistant",
                content:       data.direct_answer,
                source:        data.source,
                collection_id: data.collection_id,
                collection:    { faq_pairs: data.faq_pairs }
            });

            const chatItem = document.querySelector(".chat-item[data-id='" + CHAT_ID + "'] .chat-item-title");
            if (chatItem) chatItem.textContent = label.slice(0, 60);
        }
    } catch(err) {
        document.getElementById(typingId).remove();
        thread.innerHTML += '<div class="msg msg-assistant"><div class="msg-avatar">T</div><div class="msg-body"><div class="msg-error">' + err.message + '</div></div></div>';
    } finally {
        document.getElementById("send-btn").disabled = false;
        document.getElementById("gen-btn").disabled  = false;
        scrollToBottom();
    }
}

// --- GENERATE ALL ---
async function generateAll() {
    const prompt = document.getElementById("prompt-input").value.trim();
    if (selectedFiles.length === 0) {
        alert("Please attach at least one file for Overall FAQ.");
        return;
    }

    const thread = document.getElementById("thread-inner");
    const emptyState = thread.querySelector(".empty-state");
    if (emptyState) emptyState.remove();

    const label = prompt || "Overall FAQ from all files";
    thread.innerHTML += buildUserMessage(label);

    const typingId = "typing-" + Date.now();
    thread.innerHTML += '<div class="msg msg-assistant" id="' + typingId + '"><div class="msg-avatar">T</div><div class="msg-body"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div>';
    scrollToBottom();

    document.getElementById("chat-title").textContent = label.slice(0, 60);
    document.getElementById("gen-btn").disabled     = true;
    document.getElementById("gen-all-btn").disabled = true;
    document.getElementById("send-btn").disabled    = true;

    const formData = new FormData();
    formData.append("prompt", prompt);
    selectedFiles.forEach(function(f) { formData.append("files", f); });

    try {
        const res  = await fetch("/chat/" + CHAT_ID + "/generate-all", { method: "POST", body: formData });
        const data = await res.json();

        document.getElementById(typingId).remove();

        if (data.error) {
            thread.innerHTML += '<div class="msg msg-assistant"><div class="msg-avatar">T</div><div class="msg-body"><div class="msg-error">' + data.error + '</div></div></div>';
        } else {
            lastResponseData = data;
            thread.innerHTML += buildAssistantMessage({
                role:          "assistant",
                content:       data.direct_answer,
                source:        data.source,
                collection_id: data.collection_id,
                collection:    { faq_pairs: data.faq_pairs }
            });

            const chatItem = document.querySelector(".chat-item[data-id='" + CHAT_ID + "'] .chat-item-title");
            if (chatItem) chatItem.textContent = label.slice(0, 60);

            selectedFiles = [];
            renderFileList();
            document.getElementById("prompt-input").value = "";
        }
    } catch(err) {
    document.getElementById(typingId).remove();
    thread.innerHTML += '<div class="msg msg-assistant"><div class="msg-avatar">T</div><div class="msg-body"><div class="msg-error">' + err.message + '</div></div></div>';
    } finally {
        document.getElementById("gen-btn").disabled     = false;
        document.getElementById("gen-all-btn").disabled = false;
        document.getElementById("send-btn").disabled    = false;
        scrollToBottom();
    }
}

    // --- LANGUAGE CHANGE ---
    function onLangChange() {
        currentLang = document.getElementById("lang-select").value;
        if (!currentLang || !lastResponseData) return;
        translateLastResponse(currentLang);
    }

    async function translateLastResponse(lang) {
        if (!lastResponseData) return;

        const res = await fetch("/api/proxy/translate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                direct_answer: lastResponseData.direct_answer,
                faq_pairs:     lastResponseData.faq_pairs,
                target_language: lang
            })
        });

        const data = await res.json();
        if (data.error) { alert(data.error); return; }

        const msgs = document.querySelectorAll(".msg-assistant");
        const last = msgs[msgs.length - 1];
        if (!last) return;

        const answerEl = last.querySelector(".msg-answer");
        if (answerEl) answerEl.textContent = data.direct_answer;

        const cards = last.querySelectorAll(".faq-card");
        data.faq_pairs.forEach(function(pair, i) {
            if (cards[i]) {
                const qEl = cards[i].querySelector(".faq-q-text");
                const aEl = cards[i].querySelector(".faq-a");
                if (qEl) qEl.textContent = pair.question;
                if (aEl) aEl.textContent = pair.answer;
            }
        });

        lastResponseData = Object.assign({}, lastResponseData, {
            direct_answer: data.direct_answer,
            faq_pairs: data.faq_pairs
        });
    }

    // --- RATE FAQ ---
    async function rateFAQ(pairId, rating, btn) {
        const res  = await fetch("/chat/faq/" + pairId + "/rate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rating: rating })
        });
        const data = await res.json();
        const card = btn.closest(".faq-actions");
        card.querySelectorAll(".rate-btn").forEach(function(b) {
            b.classList.remove("active-up", "active-down");
        });
        if (data.rating === "up")   card.querySelector("[onclick*=\"'up'\"]").classList.add("active-up");
        if (data.rating === "down") card.querySelector("[onclick*=\"'down'\"]").classList.add("active-down");
    }

    // --- EDIT FAQ ---
    function startEdit(pairId) {
        const qEl = document.getElementById("faq-q-" + pairId);
        const aEl = document.getElementById("faq-a-" + pairId);
        const qText = qEl.querySelector(".faq-q-text").textContent;
        const aText = aEl.textContent;

        qEl.innerHTML = '<span class="faq-num">Q</span>' +
            '<input class="edit-input" id="edit-q-' + pairId + '" value="' + escapeHtml(qText) + '">' +
            '<button class="edit-save-btn" onclick="saveEdit(' + pairId + ')">Save</button>' +
            '<button class="edit-cancel-btn" onclick="cancelEdit(' + pairId + ', \'' + escapeHtml(qText) + '\', \'' + escapeHtml(aText) + '\')">Cancel</button>';

        aEl.innerHTML = '<textarea class="edit-textarea" id="edit-a-' + pairId + '">' + escapeHtml(aText) + '</textarea>';
    }

    async function saveEdit(pairId) {
        const question = document.getElementById("edit-q-" + pairId).value.trim();
        const answer   = document.getElementById("edit-a-" + pairId).value.trim();
        if (!question || !answer) { alert("Question and answer cannot be empty."); return; }

        const res = await fetch("/chat/faq/" + pairId + "/edit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, answer })
        });
        const data = await res.json();
        if (data.ok) {
            const qEl = document.getElementById("faq-q-" + pairId);
            const aEl = document.getElementById("faq-a-" + pairId);
            qEl.innerHTML = '<span class="faq-num">Q</span>' +
                '<span class="faq-q-text">' + escapeHtml(data.question) + '</span>' +
                '<button class="edit-btn" onclick="startEdit(' + pairId + ')" title="Edit">✏️</button>';
            aEl.textContent = data.answer;
        }
    }

    function cancelEdit(pairId, origQ, origA) {
        const qEl = document.getElementById("faq-q-" + pairId);
        const aEl = document.getElementById("faq-a-" + pairId);
        qEl.innerHTML = '<span class="faq-num">Q</span>' +
            '<span class="faq-q-text">' + origQ + '</span>' +
            '<button class="edit-btn" onclick="startEdit(' + pairId + ')" title="Edit">✏️</button>';
        aEl.textContent = origA;
    }

    // --- COPY TO CLIPBOARD ---
    function copyToClipboard(btn) {
        if (!lastResponseData) return;
        let text = lastResponseData.direct_answer + "\n\n";
        lastResponseData.faq_pairs.forEach(function(pair, i) {
            text += "Q" + (i+1) + ": " + pair.question + "\n";
            text += "A" + (i+1) + ": " + pair.answer + "\n\n";
        });
        navigator.clipboard.writeText(text).then(function() {
            btn.textContent = "✅ Copied";
            setTimeout(function() { btn.textContent = "📋 Copy"; }, 2000);
        });
    }

    // --- EXPORT PDF ---
    async function exportPDF(btn) {
        if (!lastResponseData) return;
        btn.textContent = "⏳ Exporting...";
        try {
            const res = await fetch("/chat/export/pdf", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    title:         document.getElementById("chat-title").textContent,
                    direct_answer: lastResponseData.direct_answer,
                    faq_pairs:     lastResponseData.faq_pairs
                })
            });
            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement("a");
            a.href     = url;
            a.download = "faqs.pdf";
            a.click();
            URL.revokeObjectURL(url);
            btn.textContent = "✅ Downloaded";
            setTimeout(function() { btn.textContent = "📄 PDF"; }, 2000);
        } catch(e) {
            btn.textContent = "❌ Failed";
            setTimeout(function() { btn.textContent = "📄 PDF"; }, 2000);
        }
    }

    // --- SHARE ---
    function shareCollection(collectionId) {
        const url = window.location.origin + "/share/" + collectionId;
        navigator.clipboard.writeText(url).then(function() {
            alert("Share link copied to clipboard!\n" + url);
        });
    }

    // --- VOICE READER ---
    function readAloud(btn) {
        if (!lastResponseData) return;

        if (isReading) {
            speechSynth.cancel();
            isReading = false;
            btn.textContent = "🔊 Read";
            return;
        }

        let text = lastResponseData.direct_answer + ". ";
        lastResponseData.faq_pairs.forEach(function(pair, i) {
            text += "Question " + (i+1) + ": " + pair.question + ". Answer: " + pair.answer + ". ";
        });

        currentUtterance = new SpeechSynthesisUtterance(text);

        const langMap = {
            "Tamil": "ta-IN", "Hindi": "hi-IN", "Spanish": "es-ES",
            "French": "fr-FR", "Arabic": "ar-SA", "German": "de-DE",
            "Japanese": "ja-JP", "Chinese": "zh-CN"
        };
        currentUtterance.lang = langMap[currentLang] || "en-US";
        currentUtterance.rate = 0.9;

        currentUtterance.onend = function() {
            isReading = false;
            btn.textContent = "🔊 Read";
        };

        speechSynth.speak(currentUtterance);
        isReading = true;
        btn.textContent = "⏹ Stop";
    }

    // --- AUDIO TRANSCRIBER ---
    function toggleMic() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("Your browser doesn't support voice input. Try Chrome.");
            return;
        }

        if (isRecording) {
            recognition.stop();
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();

        const langMap = {
            "Tamil": "ta-IN", "Hindi": "hi-IN", "Spanish": "es-ES",
            "French": "fr-FR", "Arabic": "ar-SA", "German": "de-DE",
            "Japanese": "ja-JP", "Chinese": "zh-CN"
        };
        recognition.lang = langMap[currentLang] || "en-US";
        recognition.continuous = false;
        recognition.interimResults = true;

        const micBtn = document.getElementById("mic-btn");
        const promptInput = document.getElementById("prompt-input");

        recognition.onstart = function() {
            isRecording = true;
            micBtn.classList.add("mic-active");
            promptInput.placeholder = "Listening...";
        };

        recognition.onresult = function(e) {
            let transcript = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
                transcript += e.results[i][0].transcript;
            }
            promptInput.value = transcript;
            autoResize(promptInput);
        };

        recognition.onend = function() {
            isRecording = false;
            micBtn.classList.remove("mic-active");
            promptInput.placeholder = "Ask anything or attach a document...";
        };

        recognition.onerror = function(e) {
            isRecording = false;
            micBtn.classList.remove("mic-active");
            promptInput.placeholder = "Ask anything or attach a document...";
            if (e.error !== "aborted") alert("Mic error: " + e.error);
        };

        recognition.start();
    }

    // --- HELPERS ---
    function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generate(); }
    }

    function autoResize(el) {
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 160) + "px";
    }

    function scrollToBottom() {
        const thread = document.getElementById("chat-thread");
        thread.scrollTop = thread.scrollHeight;
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    loadHistory();
</script>
{% endblock %}
