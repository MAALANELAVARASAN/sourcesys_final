    {% extends "base.html" %}
    {% block title %}Login - Tim FAQ{% endblock %}

    {% block content %}
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Login to your account</p>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <!-- Add this inside your login form area -->
            <div class="divider" style="text-align:center; margin: 1rem 0; color: var(--t4); font-size:0.8rem;">or</div>

            <a href="{{ url_for('google.login') }}" class="btn" style="
            display:flex; align-items:center; justify-content:center; gap:10px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 0.65rem 1rem; border-radius: 8px; text-decoration:none;
            color: var(--t1); font-size:0.9rem; transition: background 0.2s;
        " onmouseover="this.style.background='rgba(255,255,255,0.1)'"
            onmouseout="this.style.background='rgba(255,255,255,0.05)'">
            <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.86l6.09-6.09C34.46 3.08 29.5 1 24 1 14.82 1 7.07 6.48 3.64 14.18l7.08 5.5C12.4 13.08 17.73 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.7c-.55 2.96-2.2 5.47-4.67 7.15l7.18 5.57C43.44 37.26 46.5 31.3 46.5 24.5z"/>
            <path fill="#FBBC05" d="M10.72 28.32A14.6 14.6 0 0 1 9.5 24c0-1.5.26-2.95.72-4.32l-7.08-5.5A23.94 23.94 0 0 0 0 24c0 3.86.92 7.5 2.55 10.73l8.17-6.41z"/>
            <path fill="#34A853" d="M24 47c5.5 0 10.12-1.82 13.5-4.95l-7.18-5.57C28.55 37.77 26.4 38.5 24 38.5c-6.27 0-11.6-3.58-13.28-8.68l-8.17 6.41C6.07 43.52 14.42 47 24 47z"/>
            </svg>
            Continue with Google
        </a>        

        <p class="auth-switch">
                Don't have an account? 
                <a href="{{ url_for('auth.signup') }}">Signup</a>
        </p>
        </div>
    </div>
    {% endblock %}
